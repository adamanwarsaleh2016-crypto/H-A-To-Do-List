<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- تدرج بنفسجي للأسود في الخلفية -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1052"/>
      <stop offset="100%" stop-color="#0b0813"/>
    </radialGradient>
    
    <!-- تدرج إضاءة نيون لحرف T -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- توهج النيون -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- خلفية مربعة بحواف منحنية خفيفة -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>
  <rect width="500" height="500" x="6" y="6" rx="90" fill="none" stroke="#a855f7" stroke-width="4" stroke-opacity="0.3"/>

  <!-- حرف T كابيتال بحجم واضحة وبارز -->
  <text x="50%" y="54%" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="340" 
        fill="url(#neonGlow)" 
        text-anchor="middle" 
        dominant-baseline="middle"
        filter="url(#glowEffect)">T</text>
</svg>
